<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 워크스페이스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --side:#fbfbfa; --line:#e7e7e3; --line2:#d6d6d1;
  --text:#1f2328; --muted:#6b7280; --hover:#efefeb;
  --accent:#4f46e5; --accent-weak:#eef2ff; --accent-line:#c7d2fe;
  --danger:#dc2626; --ok:#16a34a; --col:#f0f0ec;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- 버튼 ---------- */
.btn,.btn-primary,.btn-danger{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line2);background:#fff}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.login-card h1{font-size:20px;margin:16px 0 6px}
.login-card p{color:var(--muted);margin:0 0 22px;line-height:1.5}
.login-card form{display:flex;flex-direction:column;gap:10px}
.login-card input{padding:11px 12px;border:1px solid var(--line2);border-radius:9px}
.login-card .btn-primary{justify-content:center;padding:11px}
#loginMsg{margin-top:14px;font-size:13px;line-height:1.5}
.forgot{margin-top:14px;font-size:12.5px;color:var(--muted);text-decoration:underline}
.forgot:hover{color:var(--text)}
.link-btn{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:10px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.logo.big{width:46px;height:46px;border-radius:12px;font-size:20px}

/* ---------- 레이아웃 ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 320px;height:100vh}
#sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ws{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:15px}
nav{flex:1;overflow:auto;padding:4px 8px 12px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:7px;text-align:left;color:#37352f;margin-bottom:1px}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-ico{width:16px;height:16px;flex:none;opacity:.75}
.soon{font-size:11px;color:var(--muted);background:var(--hover);padding:1px 7px;border-radius:99px;font-weight:500}
.nav-label{display:flex;align-items:center;justify-content:space-between;padding:18px 10px 6px;font-size:12px;color:var(--muted);font-weight:600}
.nav-label .icon-btn{width:22px;height:22px;font-size:17px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.empty-sm{color:var(--muted);font-size:12px;padding:6px 10px;line-height:1.5}
.me{border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:10px}
.me .info{flex:1;min-width:0;cursor:pointer}
.me .n{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .e{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{padding:20px 28px 0;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ph-top{display:flex;align-items:center;gap:12px;min-height:34px}
.ph h1{font-size:20px;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.ph h1 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph h1 .dot{width:12px;height:12px;border-radius:4px}
.av-stack{display:flex;align-items:center;padding-left:6px}
.av-stack .av{margin-left:-6px;border:2px solid #fff}
.av-more{font-size:12px;color:var(--muted);margin-left:6px}
.tabs{display:flex;gap:2px;margin-top:12px}
.tab{padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-color:var(--text);font-weight:600}
.content{flex:1;overflow:auto;padding:20px 28px 40px}
.loading{padding:40px;color:var(--muted)}
.people-toggle{display:inline-flex}
.people-toggle svg{flex:none}
#app.people-closed{grid-template-columns:240px minmax(0,1fr) 0}
#app.people-closed #people{display:none}

.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1}

/* ---------- 보드 ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;align-items:start;min-width:780px}
.col{background:var(--col);border-radius:12px;padding:10px;border:2px solid transparent;transition:border-color .1s}
.col.over{border-color:var(--accent-line);background:#eceefb}
.col header{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 6px 10px}
.st{width:8px;height:8px;border-radius:50%;flex:none}
.st-todo{background:#94a3b8}.st-doing{background:#f59e0b}.st-done{background:#22c55e}
.cnt{color:var(--muted);font-weight:500;font-size:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.card:hover{border-color:var(--line2)}
.card.dragging{opacity:.4}
.card-title{line-height:1.45;word-break:break-word}
.card.is-done .card-title{color:var(--muted);text-decoration:line-through}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;min-height:22px}
.due{font-size:12px;color:var(--muted)}
.due.over{color:var(--danger);font-weight:600}
.pri{display:inline-block;color:#fff;background:var(--danger);border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-right:6px;vertical-align:1px}
.quick-add input{width:100%;margin-top:8px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent}
.quick-add input::placeholder{color:var(--muted)}
.quick-add input:hover{background:rgba(255,255,255,.6)}
.quick-add input:focus{background:#fff;border-color:var(--line2);outline:none}

/* ---------- 리스트 ---------- */
.list-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list-wrap .quick-add{padding:6px 10px;border-bottom:1px solid var(--line)}
.list-wrap .quick-add input{margin:0}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafaf9}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fafaf8}
tbody tr:last-child td{border-bottom:0}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:11px}
.check.on{background:var(--ok);border-color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--hover);white-space:nowrap}
.who{display:flex;align-items:center;gap:7px;white-space:nowrap}
.muted{color:var(--muted)}

/* ---------- 문서 ---------- */
.docs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.doc-list{display:flex;flex-direction:column;gap:2px}
.doc-list .btn{margin-bottom:8px;justify-content:center}
.doc-item{text-align:left;padding:7px 10px;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item:hover{background:var(--hover)}
.doc-item.active{background:#fff;border:1px solid var(--line);font-weight:600}
.doc-editor{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 32px 16px;min-height:60vh;display:flex;flex-direction:column}
.doc-toolbar{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.doc-toolbar button{padding:5px 9px;border-radius:6px;font-size:13px;color:#444}
.doc-toolbar button:hover{background:var(--hover)}
.doc-title{border:0;outline:0;font-size:28px;font-weight:700;padding:6px 0;width:100%}
.doc-body{flex:1;outline:0;line-height:1.7;font-size:15px;padding:6px 0 30px;min-height:300px}
.doc-body:empty::before{content:attr(data-placeholder);color:#aaa}
.doc-body h1{font-size:24px;margin:18px 0 6px}.doc-body h2{font-size:19px;margin:16px 0 4px}.doc-body h3{font-size:16px;margin:14px 0 4px}
.doc-body p{margin:4px 0}
.doc-body blockquote{border-left:3px solid var(--line2);margin:8px 0;padding:2px 12px;color:#555}
.doc-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}

/* ---------- 빈 화면 ---------- */
.placeholder{max-width:420px;margin:60px auto;text-align:center;color:var(--muted);line-height:1.6}
.placeholder .big-ico{width:56px;height:56px;border-radius:16px;background:var(--accent-weak);color:var(--accent);display:inline-grid;place-items:center;font-size:26px;margin-bottom:10px}
.placeholder h2{color:var(--text);font-size:18px;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:50px 20px}

/* ---------- 오른쪽: 팀원 ---------- */
#people{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.people-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;gap:8px}
.people-head h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}
.search{margin:0 16px 8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search:focus{outline:none;border-color:var(--line2);background:#fff}
#peopleList{flex:1;overflow:auto;padding:4px 8px 16px}
.person{display:flex;gap:10px;padding:10px 8px;border-radius:9px;align-items:flex-start}
.person:hover{background:#fafaf8}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pemail{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;background:#fef3c7;color:#92400e}
.badge.me{background:var(--accent-weak);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 4px 2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 10%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);border:1px solid color-mix(in srgb,var(--c) 25%,#fff)}
.chip.ro{padding-right:8px}
.chip-x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:13px;line-height:1;opacity:.55}
.chip-x:hover{opacity:1;background:rgba(0,0,0,.08)}
.nochip{font-size:11.5px;color:var(--muted)}

/* ---------- 드로어(작업 상세) ---------- */
#drawer{position:fixed;inset:0;pointer-events:none;z-index:40}
#drawer.open{pointer-events:auto}
.drawer-backdrop{position:absolute;inset:0;background:rgba(15,15,15,.12)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.06);padding:16px 24px 24px;overflow:auto;display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.drawer-head .sp{flex:1}
.done-btn{border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.done-btn.on{background:#ecfdf5;border-color:#a7f3d0;color:var(--ok)}
.t-title{width:100%;border:0;outline:0;font-size:22px;font-weight:700;resize:none;padding:4px 0;line-height:1.35;overflow:hidden}
.fields{display:grid;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center;margin:14px 0 18px}
.fields label{color:var(--muted);font-size:13px}
.fields select,.fields input{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;max-width:260px}
.lbl{display:block;color:var(--muted);font-size:13px;font-weight:600;margin:14px 0 6px}
.hint{font-weight:400;color:#9ca3af;margin-left:4px}
.t-desc{width:100%;min-height:220px;flex:1;border:1px solid var(--line);border-radius:9px;padding:12px;line-height:1.6;resize:vertical}
.t-desc:focus,.fields select:focus,.fields input:focus{outline:none;border-color:var(--accent-line)}
.t-meta{color:var(--muted);font-size:12px;margin-top:12px}

/* ---------- 모달 ---------- */
#modalRoot{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px}
#modalRoot.open{display:grid}
.modal-bg{position:absolute;inset:0;background:rgba(15,15,15,.35)}
.modal{position:relative;background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{color:var(--muted);margin:0 0 12px;font-size:13px;line-height:1.5}
.modal textarea,.modal input[type=text],.modal input[type=email]{width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:9px;resize:vertical}
.modal textarea:focus,.modal input:focus{outline:none;border-color:var(--accent)}
.toggles{display:flex;flex-direction:column;gap:6px}
.toggle-row{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;user-select:none}
.toggle-row:hover{background:#fafaf8}
.toggle-row .nm{flex:1}
.toggle-row input{position:absolute;opacity:0;pointer-events:none}
.switch{width:36px;height:20px;border-radius:99px;background:#d4d4d0;position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle-row input:checked + .switch{background:var(--accent)}
.toggle-row input:checked + .switch::after{left:18px}
.toggle-row:has(input:checked){border-color:var(--accent-line);background:var(--accent-weak)}
.toggle-row input:focus-visible + .switch{outline:2px solid var(--accent);outline-offset:2px}
.sel-all{font-size:12px;color:var(--accent);font-weight:600}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.alert{background:#fef2f2;color:#991b1b;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:12px;line-height:1.5;word-break:break-all}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid transparent}
.swatch.on{border-color:var(--text);box-shadow:inset 0 0 0 2px #fff}
.person.mini{padding:8px 0 14px}

/* ---------- 토스트 / 데모 표시 ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1f2328;color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:#b91c1c}
#demoBanner{position:fixed;left:12px;bottom:66px;z-index:30;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:8px;padding:6px 10px;font-size:11.5px;width:216px;line-height:1.45}

/* ---------- 연사 마스터 ---------- */
.fs{border:0;margin:0;padding:0;min-width:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.tg{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:5px;font-size:12.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.tg-gray{background:#ebebe8;color:#55534e}
.tg-red{background:#fde0dd;color:#b42318}
.tg-blue{background:#dbe7fd;color:#1d4ed8}
.tg-green{background:#d6f3e0;color:#15803d}
.tg-yellow{background:#fbefc2;color:#8a5a00}
.tg-purple{background:#ece4fd;color:#6d28d9}
.tg-empty{color:#b4b4b0;font-size:13px}
.gnum{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:5px;background:#1f2328;color:#fff;font-size:11px;font-weight:700;margin-right:6px;padding:0 5px}
.ro-note{font-size:12px;color:#92400e;background:#fef3c7;border-radius:6px;padding:4px 9px;white-space:nowrap}
.ph-top .btn{padding:6px 12px}
.ph-top .btn svg{flex:none}
.badge-n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;padding:0 5px}

.sp-toolbar{display:flex;align-items:center;gap:8px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;flex-wrap:wrap}
.sp-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
.tool{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.tool:hover{background:var(--hover);color:var(--text)}
.tool.on{color:var(--accent);background:var(--accent-weak)}
.search-box{display:flex;align-items:center;border-radius:8px;border:1px solid transparent;transition:background .15s}
.search-box input{width:0;padding:0;border:0;outline:0;background:transparent;transition:width .18s,padding .18s;font-size:13px}
.search-box.open{background:#fff;border-color:var(--line2)}
.search-box.open input{width:190px;padding:5px 10px 5px 0}
.filter-note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.filter-note a{color:var(--accent);cursor:pointer;font-weight:600}

/* 목록 표 */
.sp-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 230px)}
.sp-table{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px;table-layout:fixed}
.sp-table th{position:sticky;top:0;z-index:3;background:#fafaf9;font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);border-right:1px solid #f0f0ed;white-space:nowrap}
.sp-table td{padding:0;border-bottom:1px solid #efefec;border-right:1px solid #f3f3f0;height:38px;vertical-align:middle;background:#fff}
.sp-table .c-chk{width:62px}.sp-table .c-name{width:230px}.sp-table .c-asg{width:200px}.sp-table .c-nat{width:110px}.sp-table .c-st{width:126px}
.sp-table .c-pp{width:170px}.sp-table .c-pn{width:130px}.sp-table .c-birth{width:120px}.sp-table .c-pri{width:90px}
.sp-table th.c-chk,.sp-table td:first-child{position:sticky;left:0;z-index:2}
.sp-table th.c-name,.sp-table tr.sp-row td:nth-child(2){position:sticky;left:62px;z-index:2;box-shadow:1px 0 0 var(--line)}
.sp-table th.c-chk,.sp-table th.c-name{z-index:4}
.grp-head td{background:#fbfbfa!important;border-bottom:1px solid var(--line);height:auto;position:static!important}

  const m = e?.message || '';
  toast(/row-level security|permission denied|violates/i.test(m) ? '편집 권한이 없어요 (뷰어는 보기만 가능해요)'
    : /does not exist|schema cache|could not find/i.test(m) ? '데이터베이스 설정이 아직 안 됐어요. 새 SQL(schema_v2)을 실행해 주세요.'
    : (m || '오류가 발생했어요'), true);
}

/* =====================================================================
   데이터 계층 ① Supabase
   ===================================================================== */
function supabaseApi() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const q = async p => { const { data, error } = await p; if (error) throw error; return data; };
  return {
    async getUser() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    onAuth(cb) { sb.auth.onAuthStateChange((ev, session) => setTimeout(() => cb(ev, session), 0)); },
    async signIn(email, password) {
      const data = await q(sb.auth.signInWithPassword({ email, password }));
      if (data.user?.user_metadata?.password_set !== true) await sb.auth.updateUser({ data: { password_set: true } });
      return data.user;
    },
    sendReset: email => q(sb.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT })),
    setPassword: password => q(sb.auth.updateUser({ password, data: { password_set: true } })),
    signOut: () => sb.auth.signOut(),
    profile: id => q(sb.from('profiles').select('*').eq('id', id).single()),
    profiles: () => q(sb.from('profiles').select('*').order('full_name')),
    updateMyName: (id, full_name) => q(sb.from('profiles').update({ full_name }).eq('id', id)),
    projects: () => q(sb.from('projects').select('*').order('sort_order').order('created_at')),
    createProject: (name, color, sort_order) => q(sb.from('projects').insert({ name, color, sort_order }).select().single()),
    members: () => q(sb.from('project_members').select('*')),
    setMemberRole: (project_id, user_id, role) => q(sb.from('project_members').update({ role }).eq('project_id', project_id).eq('user_id', user_id)),
    // ---- 연사 마스터 ----
    nationalities: () => q(sb.from('nationalities').select('*').order('sort_order').order('created_at')),
    addNationality: (name, color, sort_order) => q(sb.from('nationalities').insert({ name, color, sort_order }).select().single()),
    speakers: pid => q(sb.from('speakers').select('*').eq('project_id', pid).order('position')),
    createSpeaker: s => q(sb.from('speakers').insert(s).select().single()),
    updateSpeaker: (id, patch) => q(sb.from('speakers').update(patch).eq('id', id).select('id,updated_at').single()),
    deleteSpeaker: id => q(sb.from('speakers').delete().eq('id', id)),
    links: sid => q(sb.from('speaker_links').select('*').eq('speaker_id', sid).order('created_at')),
    addLink: (speaker_id, target_type, target_id) => q(sb.from('speaker_links').insert({ speaker_id, target_type, target_id }).select().single()),
    removeLink: id => q(sb.from('speaker_links').delete().eq('id', id)),
    async resolveTargets({ speaker = [], task = [] }) {
      // 보안 규칙 때문에 내가 속한 프로젝트의 항목만 돌아옵니다
      const [a, b] = await Promise.all([
        speaker.length ? q(sb.from('speakers').select('id,name,project_id').in('id', speaker)) : [],
        task.length ? q(sb.from('tasks').select('id,title,project_id').in('id', task)) : [],
      ]);
      return [...a.map(x => ({ type:'speaker', id:x.id, title:x.name, project_id:x.project_id })),
              ...b.map(x => ({ type:'task', id:x.id, title:x.title, project_id:x.project_id }))];
    },
    async searchTargets(term) {
      const like = `%${term.replace(/[%_\\]/g, m => '\\' + m)}%`;
      let s1 = sb.from('speakers').select('id,name,project_id').order('updated_at', { ascending:false }).limit(40);
      let s2 = sb.from('tasks').select('id,title,project_id').order('updated_at', { ascending:false }).limit(40);
      if (term) { s1 = s1.ilike('name', like); s2 = s2.ilike('title', like); }
      const [a, b] = await Promise.all([q(s1), q(s2).catch(() => [])]);
      return [...a.map(x => ({ type:'speaker', id:x.id, title:x.name, project_id:x.project_id })),
              ...b.map(x => ({ type:'task', id:x.id, title:x.title, project_id:x.project_id }))];
    },
    uploadFile: (path, file, contentType) => q(sb.storage.from('speaker-files').upload(path, file, { contentType, upsert:false })),
    async fileUrl(path) { const d = await q(sb.storage.from('speaker-files').createSignedUrl(path, 3600)); return d.signedUrl; },
    removeFiles: paths => q(sb.storage.from('speaker-files').remove(paths)),
    subscribe(pid, cb) {
      const ch = sb.channel('project-' + pid)
        .on('postgres_changes', { event:'INSERT', schema:'public', table:'speakers', filter:`project_id=eq.${pid}` }, p => cb('speakers', p))
        .on('postgres_changes', { event:'UPDATE', schema:'public', table:'speakers', filter:`project_id=eq.${pid}` }, p => cb('speakers', p))
        .on('postgres_changes', { event:'DELETE', schema:'public', table:'speakers' }, p => cb('speakers', p))
        .on('postgres_changes', { event:'*', schema:'public', table:'speaker_links' }, p => cb('links', p))
        .on('postgres_changes', { event:'*', schema:'public', table:'nationalities' }, p => cb('nat', p))
        .on('postgres_changes', { event:'*', schema:'public', table:'project_members' }, p => cb('members', p))
        .subscribe();
      return () => sb.removeChannel(ch);
    },
    addMember: (project_id, user_id) => q(sb.from('project_members').upsert({ project_id, user_id }, { onConflict: 'project_id,user_id', ignoreDuplicates: true })),
    removeMember: (project_id, user_id) => q(sb.from('project_members').delete().eq('project_id', project_id).eq('user_id', user_id)),
    tasks: pid => q(sb.from('tasks').select('*').eq('project_id', pid).order('position')),
    createTask: t => q(sb.from('tasks').insert(t).select().single()),
    updateTask: (id, patch) => q(sb.from('tasks').update(patch).eq('id', id).select().single()),
    deleteTask: id => q(sb.from('tasks').delete().eq('id', id)),
    docs: pid => q(sb.from('docs').select('*').eq('project_id', pid).order('created_at')),
    createDoc: d => q(sb.from('docs').insert(d).select().single()),
    updateDoc: (id, patch) => q(sb.from('docs').update(patch).eq('id', id)),
    deleteDoc: id => q(sb.from('docs').delete().eq('id', id)),
    async invite(email, projectIds) {
      const { data, error } = await sb.functions.invoke('invite-user', { body: { email, projectIds, redirectTo: REDIRECT } });
      if (error) {
        let msg = error.message;
        try { const b = await error.context.json(); if (b?.error) msg = b.error; } catch (_) {}
        throw new Error(msg);
      }
      if (data?.error) throw new Error(data.error);
      return data;
    },
  };
}

    if (wanted && !isMember(wanted)) toast('그 프로젝트에 초대받지 않아 열 수 없어요', true);
    if (first) openProject(first); else { renderAll(); }
    // 처음 초대받아 들어온 사람(비밀번호 없음) 또는 재설정 링크 → 비밀번호 설정 창
    if (needPassword || CAME_FROM_RECOVERY || user.user_metadata?.password_set !== true) passwordModal(true);
  } catch (e) {
    booted = false; console.error(e); showLogin();
    const m = e.message || String(e);
    loginMsg(/0 rows|no rows|multiple \(or no\)/i.test(m)
      ? '비밀번호는 맞지만 프로필이 없어요. SQL Editor에서 프로필 보정 SQL(1번)을 실행해 주세요.'
      : '로그인 후 데이터를 불러오지 못했어요: ' + m, 'var(--danger)');
  }
}

async function reloadMeta() {
  [S.profiles, S.projects, S.members] = await Promise.all([api.profiles(), api.projects(), api.members()]);
  S.me = prof(S.me.id) || S.me;
}

function loginMsg(text, color) { const m = $('#loginMsg'); m.style.color = color || 'var(--muted)'; m.textContent = text; }

async function handleLogin(e) {
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const pw = $('#loginPw').value;
  const btn = $('#loginForm button');
  btn.disabled = true; loginMsg('로그인 중…');
  try {
    const user = await api.signIn(email, pw);
    loginMsg('');
    boot(user);
  } catch (er) {
    console.error(er);
    const m = er.message || String(er);
    loginMsg(/failed to fetch|network/i.test(m) ? 'Supabase 서버에 연결하지 못했어요. 인터넷 연결이나 Project URL을 확인해 주세요.'
      : /invalid login/i.test(m) ? '이메일 또는 비밀번호가 맞지 않아요. 처음이라면 초대 메일의 링크로 먼저 들어와 비밀번호를 정해 주세요.'
      : /not confirmed/i.test(m) ? '아직 초대를 수락하지 않았어요. 초대 메일의 링크를 먼저 눌러 주세요.'
      : /rate|security purposes/i.test(m) ? '시도가 너무 잦아요. 잠시 후 다시 시도하세요.' : m, 'var(--danger)');
  } finally { btn.disabled = false; }
}

async function handleForgot() {
  const email = $('#loginEmail').value.trim().toLowerCase();
  if (!EMAIL_RE.test(email)) return loginMsg('위 칸에 이메일을 먼저 입력한 뒤 다시 눌러 주세요.', 'var(--danger)');
  loginMsg('보내는 중…');
  try {
    await api.sendReset(email);
    loginMsg(`${email} 메일함을 확인하세요. 링크를 누르면 새 비밀번호를 정할 수 있어요.`, 'var(--ok)');
  } catch (er) {
    loginMsg(/rate|security purposes/i.test(er.message || '') ? '요청이 너무 잦아요. 잠시 후 다시 시도하세요.' : er.message, 'var(--danger)');
  }
}

// 비밀번호 설정/변경 창 (required=true 이면 닫을 수 없음)
function passwordModal(required) {
  openModal(`<h3>${required ? '비밀번호 설정' : '비밀번호 변경'}</h3>
    <p class="sub">${required ? '다음부터는 이메일과 이 비밀번호로 바로 로그인할 수 있어요.' : '새 비밀번호를 입력하세요.'}</p>
    <label class="lbl">새 비밀번호 <span class="hint">8자 이상</span></label>
    <input type="password" id="pw1" autocomplete="new-password" style="width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:9px">
    <label class="lbl">한 번 더 입력</label>
    <input type="password" id="pw2" autocomplete="new-password" style="width:100%;padding:10px 11px;border:1px solid var(--line2);border-radius:9px">
    <div class="modal-foot">${required ? '' : '<button class="btn" data-act="closeModal">취소</button>'}<button class="btn-primary" id="pwSave">저장</button></div>`, required);
  setTimeout(() => $('#pw1')?.focus(), 40);
  const save = async () => {
    const a = $('#pw1').value, b = $('#pw2').value;
    if (a.length < 8) return toast('비밀번호는 8자 이상으로 정해 주세요', true);
    if (a !== b) return toast('두 비밀번호가 서로 달라요', true);
    $('#pwSave').disabled = true;
    try { await api.setPassword(a); needPassword = false; closeModal(true); toast('비밀번호를 저장했어요'); }
    catch (e) {
      $('#pwSave').disabled = false;
      toast(/different from the old/i.test(e.message || '') ? '이전과 다른 비밀번호를 입력하세요' : (e.message || '저장하지 못했어요'), true);
    }
  };
  $('#pwSave').onclick = save;
  $('#pw2').onkeydown = e => { if (e.key === 'Enter') save(); };
}

function projectHeadHtml(p) {
  const mem = projectMembers(p.id);
  const stack = mem.slice(0, 6).map(u => avatar(u, 26)).join('');
  const more = mem.length > 6 ? `<span class="av-more">+${mem.length - 6}</span>` : '';
  return `<div class="ph-top"><h1><span class="dot" style="background:${esc(p.color)}"></span><span class="t">${esc(p.name)}</span></h1>
    <div class="av-stack" title="멤버 ${mem.length}명">${stack}${more}</div>
    ${myRole(p.id) === 'viewer' ? '<span class="ro-note">보기 전용</span>' : ''}
    <button class="btn" data-act="share">${ICON.share}공유</button>${peopleBtn}</div>`;
}

function dueHtml(t) {
  if (!t.due_date) return '<span></span>';
  const over = t.status !== 'done' && t.due_date < todayStr();
  return `<span class="due ${over ? 'over' : ''}">${over ? '지연 · ' : ''}${fmtDate(t.due_date)}</span>`;
}

function boardHtml() {
  return `<div class="board">${STATUS.map(s => {
    const items = S.tasks.filter(t => t.status === s.k);
    return `<section class="col" data-drop="${s.k}">
      <header><span class="st st-${s.k}"></span>${s.label}<span class="cnt">${items.length}</span></header>
      <div class="cards">${items.map(cardHtml).join('')}</div>
      <form class="quick-add" data-status="${s.k}"><input placeholder="+ 작업 추가" maxlength="200"></form>
    </section>`;
  }).join('')}</div>`;
}
function cardHtml(t) {
  const a = prof(t.assignee_id);
  return `<article class="card ${t.status === 'done' ? 'is-done' : ''}" draggable="true" data-id="${t.id}" data-act="openTask">
    <div class="card-title">${t.priority === 'high' ? '<span class="pri">중요</span>' : ''}${esc(t.title)}</div>
    <div class="card-meta">${dueHtml(t)}${a ? avatar(a, 22) : ''}</div>
  </article>`;
}

function listHtml() {
  const order = { todo:0, doing:1, done:2 };
  const rows = [...S.tasks].sort((a, b) => order[a.status] - order[b.status] || (a.due_date || '9999').localeCompare(b.due_date || '9999'));
  return `<div class="list-wrap">
    <form class="quick-add" data-status="todo"><input placeholder="+ 작업 추가 (Enter)" maxlength="200"></form>
    ${rows.length ? `<table><thead><tr><th style="width:40px"></th><th>작업</th><th style="width:140px">담당자</th><th style="width:120px">마감일</th><th style="width:80px">우선순위</th><th style="width:100px">상태</th></tr></thead><tbody>
    ${rows.map(t => { const a = prof(t.assignee_id); return `<tr data-act="openTask" data-id="${t.id}">
      <td><button class="check ${t.status === 'done' ? 'on' : ''}" data-act="toggleDone" data-id="${t.id}" title="완료 표시">${t.status === 'done' ? '✓' : ''}</button></td>
      <td class="${t.status === 'done' ? 'muted' : ''}" style="${t.status === 'done' ? 'text-decoration:line-through' : ''}">${esc(t.title)}</td>
      <td>${a ? `<span class="who">${avatar(a, 22)}${esc(a.full_name || a.email)}</span>` : '<span class="muted">—</span>'}</td>
      <td>${t.due_date ? dueHtml(t) : '<span class="muted">—</span>'}</td>
      <td>${t.priority === 'high' ? '<span class="pri">중요</span>' : `<span class="muted">${PRIORITY[t.priority]}</span>`}</td>
      <td><span class="pill"><span class="st st-${t.status}"></span>${STATUS_LABEL[t.status]}</span></td>
    </tr>`; }).join('')}</tbody></table>` : '<div class="empty">아직 작업이 없어요. 위에 입력해서 첫 작업을 만들어 보세요.</div>'}
  </div>`;
}

function docsHtml() {
  let d = S.docs.find(x => x.id === S.docId) || S.docs[0];
  S.docId = d?.id || null;
  const list = S.docs.map(x => `<button class="doc-item ${x.id === S.docId ? 'active' : ''}" data-act="openDoc" data-id="${x.id}">${esc(x.title || '제목 없음')}</button>`).join('');

    .map(([c, l]) => `<button type="button" data-cmd="${c}">${l}</button>`).join('');
  return `<div class="docs">
    <div class="doc-list"><button class="btn" data-act="newDoc">+ 새 문서</button>${list || '<div class="empty-sm">문서가 없어요</div>'}</div>
    <div class="doc-editor">${d ? `

      <div class="doc-body" id="docBody" contenteditable="true" data-placeholder="회의록, 진행 메모, 가이드 등을 자유롭게 적어 보세요…">${DOMPurify.sanitize(d.content || '')}</div>

/* =====================================================================
   프로젝트 / 작업
   ===================================================================== */
let unsubRT = null;
function leaveProject() {
  flushDoc(); closePop(); closeSpPage(); closeDrawer();
  if (unsubRT) { try { unsubRT(); } catch (_) {} unsubRT = null; }
}
async function openProject(pid) {
  leaveProject();
  S.view = 'project'; S.pid = pid; S.docId = null; S.pinned = new Set();
  renderSidebar();
  $('#main').innerHTML = '<div class="loading">불러오는 중…</div>';
  $('#people').classList.remove('open');
  if (isSpeakerProject(curProject())) {
    try { S.speakers = await api.speakers(pid); } catch (e) { S.speakers = []; err(e); }
    if (S.pid !== pid) return;
    try { unsubRT = api.subscribe(pid, onRealtime); } catch (e) { console.error(e); }
  } else {
    try { [S.tasks, S.docs] = await Promise.all([api.tasks(pid), api.docs(pid)]); }
    catch (e) { S.tasks = []; S.docs = []; err(e); }
  }
  if (S.pid === pid) renderMain();
}

async function createTask(status, title) {
  const t = await api.createTask({ project_id: S.pid, title, status, position: Date.now() });
  S.tasks.push(t);
}

async function updateTaskField(id, field, value) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  let v = value;
  if (field === 'title') { v = String(v).trim(); if (!v) { toast('작업 이름은 비워 둘 수 없어요', true); return openTask(id); } }
  if (field === 'assignee_id' || field === 'due_date') v = v || null;
  if (t[field] === v) return;
  try {
    const u = await api.updateTask(id, { [field]: v });
    Object.assign(t, u);
    renderMain();
    if ($('#drawer').classList.contains('open') && $('#drawer').dataset.id === id && (field === 'status')) openTask(id);
  } catch (e) { err(e); }
}

function openTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const mem = projectMembers(S.pid);
  if (t.assignee_id && !mem.some(m => m.id === t.assignee_id) && prof(t.assignee_id)) mem.push(prof(t.assignee_id));
  const creator = prof(t.created_by);
  const dr = $('#drawer');
  dr.dataset.id = id;
  dr.innerHTML = `<div class="drawer-backdrop" data-act="closeDrawer"></div>
  <div class="drawer-panel">
    <div class="drawer-head">
      <button class="done-btn ${t.status === 'done' ? 'on' : ''}" data-act="toggleDone" data-id="${t.id}">${t.status === 'done' ? '✓ 완료됨' : '✓ 완료로 표시'}</button>
      <span class="sp"></span>
      <button class="btn-danger" data-act="deleteTask" data-id="${t.id}">삭제</button>
      <button class="icon-btn" data-act="closeDrawer" title="닫기">✕</button>
    </div>
    <textarea class="t-title" data-field="title" rows="1" maxlength="200">${esc(t.title)}</textarea>
    <div class="fields">
      <label>상태</label><select data-field="status">${STATUS.map(s => `<option value="${s.k}" ${t.status === s.k ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
      <label>담당자</label><select data-field="assignee_id"><option value="">담당자 없음</option>${mem.map(u => `<option value="${u.id}" ${t.assignee_id === u.id ? 'selected' : ''}>${esc(u.full_name || u.email)}</option>`).join('')}</select>
      <label>마감일</label><input type="date" data-field="due_date" value="${t.due_date || ''}">
      <label>우선순위</label><select data-field="priority">${Object.entries(PRIORITY).map(([k, l]) => `<option value="${k}" ${t.priority === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <label class="lbl">설명</label>
    <textarea class="t-desc" data-field="description" placeholder="세부 내용, 링크, 메모를 적어 주세요.">${esc(t.description || '')}</textarea>
    <div class="t-meta">${creator ? esc(creator.full_name || creator.email) + ' 님이 만듦 · ' : ''}${fmtDT(t.created_at)}${t.updated_at ? ' · 마지막 수정 ' + fmtDT(t.updated_at) : ''}</div>
  </div>`;
  dr.classList.add('open');
  autosize($('.t-title', dr));
}
function closeDrawer() {
  const a = document.activeElement; if (a && a.closest('#drawer')) a.blur(); // 편집 중인 내용 저장
  $('#drawer').classList.remove('open'); $('#drawer').innerHTML = '';

    if (v.nat.length && !v.nat.includes(s.nationality_id)) return false;
    if (v.ev.some(f => !s[f])) return false;
    if (v.diet && !s.diet_flag) return false;
    if (v.asg.length && !(s.assignees || []).some(a => v.asg.includes(a))) return false;

  });

function spSort(list) {
  const k = sv().sort, a = [...list];
  const cmpName = (x, y) => !x.name ? (y.name ? 1 : 0) : !y.name ? -1 : x.name.localeCompare(y.name, 'en', { numeric:true, sensitivity:'base' });
  if (k === 'alpha') a.sort(cmpName);
  else if (k === 'assignee') a.sort((x, y) => { const ax = pname(x.assignees?.[0]), ay = pname(y.assignees?.[0]);
    return (!ax && ay) ? 1 : (ax && !ay) ? -1 : (ax.localeCompare(ay, 'ko') || cmpName(x, y)); });
  else if (k === 'created') a.sort((x, y) => String(y.created_at).localeCompare(String(x.created_at)));
  else if (k === 'updated') a.sort((x, y) => String(y.updated_at).localeCompare(String(x.updated_at)));
  else a.sort((x, y) => x.position - y.position);
  return a;
}

/* ---------- 대시보드 ---------- */
function spDashHtml() {
  const all = S.speakers, total = all.length, done = all.filter(s => s.done).length, open = total - done;
  const pct = total ? Math.round(done / total * 100) : 0;
  const bar = (n, d, max) => `<div class="bar"><i style="width:${max ? d / max * 100 : 0}%;background:var(--ok)"></i><i style="width:${max ? (n - d) / max * 100 : 0}%;background:#c7d2fe"></i></div>`;
  const drow = (label, items) => ({ label, n: items.length, d: items.filter(s => s.done).length });
  const rowsHtml = rows => { const max = Math.max(1, ...rows.map(r => r.n));
    return rows.map(r => `<div class="drow"><div class="drow-top"><div class="dlab">${r.label}</div>
      <div class="dnum"><b>${r.n}</b><span class="muted"> · 완료 ${r.d} · 미완료 ${r.n - r.d}</span></div></div>${bar(r.n, r.d, max)}</div>`).join(''); };
  const grpRows = GROUPS.map(g => drow(`<span class="gnum">${g.k}</span>${tag(g.tone, g.label)}`, all.filter(s => s.grp === g.k)));
  const mem = projectMembers(S.pid);
  const asgRows = mem.map(p => drow(`<span class="who-chip">${avatar(p, 20)}${esc(p.full_name || p.email)}</span>`, all.filter(s => (s.assignees || []).includes(p.id))));
  asgRows.sort((a, b) => b.n - a.n);
  const none = all.filter(s => !(s.assignees || []).length);
  if (none.length) asgRows.push(drow('<span class="muted">담당자 없음</span>', none));
  const statChips = (list, field) => list.map(o => `<div class="stat">${tag(o.tone, o.label)}<b>${all.filter(s => (s[field] || 'none') === o.k).length}</b></div>`).join('');
  const evStat = (label, n) => `<div class="stat"><span>${label}</span><b>${n}</b></div>`;
  return `<div class="dash">
    <div class="kpis">
      <div class="kpi"><div class="l">작업 합계</div><div class="v">${total}</div></div>
      <div class="kpi"><div class="l">완료된 작업 합계</div><div class="v" style="color:var(--ok)">${done}</div></div>
      <div class="kpi"><div class="l">미완료 작업 합계</div><div class="v" style="color:var(--accent)">${open}</div></div>
    </div>
    <div class="dcard"><div class="prog-h"><span>완료율</span><b>${pct}%</b></div><div class="bar big"><i style="width:${pct}%;background:var(--ok)"></i></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>완료</span><span><i style="background:#c7d2fe"></i>미완료</span></div></div>
    <div class="dash-cols">
      <div class="dcard"><h4>그룹별 합계</h4>${rowsHtml(grpRows)}</div>
      <div class="dcard"><h4>담당자별 작업 합계</h4>${asgRows.length ? rowsHtml(asgRows) : '<div class="muted">아직 연사가 없어요</div>'}</div>
    </div>
    <div class="dash-cols">
      <div class="dcard"><h4>항공 현황</h4><div class="stats">${statChips(FLIGHT, 'flight_status')}</div></div>
      <div class="dcard"><h4>숙박 현황</h4><div class="stats">${statChips(HOTEL, 'hotel_status')}</div></div>
    </div>
    <div class="dcard"><h4>행사 참석 · 특이식성</h4><div class="stats">
      ${EVENTS.map(ev => evStat(ev.label + ' 참석', all.filter(s => s[ev.f]).length)).join('')}
      ${evStat('특이식성 있음', all.filter(s => s.diet_flag).length)}
      ${[1, 2, 3].map(d => evStat(d + '일차 참석 가능', all.filter(s => s['day' + d]).length)).join('')}
    </div></div>
  </div>`;
}

/* ---------- 저장 ---------- */
function spRefresh(from) {
  if (from !== 'body') renderSpBody();
  if (S.spId && from !== 'page') renderSpPage();
}
async function updateSpeaker(id, patch, from) {
  const s = spOf(id); if (!s) return;
  const prev = {}; for (const k in patch) prev[k] = s[k];
  Object.assign(s, patch, { updated_at: new Date().toISOString() });
  spRefresh(from);
  try { const row = await api.updateSpeaker(id, patch); const cur = spOf(id); if (cur && row?.updated_at) cur.updated_at = row.updated_at; }
  catch (e) { const cur = spOf(id); if (cur) Object.assign(cur, prev); spRefresh(); err(e); }
}
async function spAdd(el) {
  if (!canEdit()) return;
  const field = el?.dataset?.field, raw = el?.dataset?.val;
  const init = { project_id: S.pid, name: '', grp: 1, position: Date.now() };
  if (field) init[field] = field === 'grp' ? Number(raw) : raw;
  try {
    const s = await api.createSpeaker(init);
    if (!spOf(s.id)) S.speakers.push(s);
    S.pinned.add(s.id);
    const v = sv(); v.fold = v.fold.filter(k => k !== s.grp);
    renderSpBody(true);
    if (S.stab === 'list') {
      const inp = document.querySelector(`tr[data-sid="${s.id}"] .nm-in`);
      if (inp) { inp.scrollIntoView({ block:'center' }); inp.focus(); }

  } catch (e) { err(e); }
}
async function addNationality(name) {
  const exist = S.nats.find(n => norm(n.name) === norm(name)); if (exist) return exist;
  try {
    const n = await api.addNationality(name, NAT_COLORS[S.nats.length % NAT_COLORS.length], Math.max(0, ...S.nats.map(x => x.sort_order || 0)) + 1);
    if (!S.nats.some(x => x.id === n.id)) S.nats.push(n);
    toast(`'${name}' 국적을 추가했어요. 모든 목록에서 쓸 수 있어요`);
    return n;
  } catch (e) { err(e); return null; }
}

/* ---------- 팝오버 (토글 선택) ---------- */
const POP = { el:null, anchor:null };
function closePop() { POP.el?.remove(); POP.el = null; POP.anchor = null; }
function openPop(anchor, build) {
  if (POP.anchor === anchor) { closePop(); return; }
  closePop();
  const el = document.createElement('div'); el.className = 'pop';
  document.body.appendChild(el);
  POP.el = el; POP.anchor = anchor;
  build(el); placePop();
}
function placePop() {
  const el = POP.el, a = POP.anchor; if (!el || !a || !a.isConnected) return;
  const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  let top = r.bottom + 4; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
document.addEventListener('mousedown', e => {
  if (POP.el && !POP.el.contains(e.target) && !(POP.anchor && POP.anchor.contains(e.target))) closePop();
}, true);
window.addEventListener('resize', closePop);
document.addEventListener('scroll', e => { if (POP.el && !POP.el.contains(e.target)) closePop(); }, true);

function pickList(anchor, { options, value, multi, onPick, searchable, onCreate, title }) {
  const sel = multi ? new Set(value || []) : value;
  let q = '';
  openPop(anchor, el => {
    el.innerHTML = `${title ? `<div class="pop-h">${title}</div>` : ''}${searchable ? `<input class="pop-search" placeholder="${onCreate ? '검색 또는 새로 추가…' : '검색…'}">` : ''}<div class="pop-list"></div>`;
    const list = el.querySelector('.pop-list');
    const draw = () => {
      const nq = norm(q);
      const shown = options.filter(o => !nq || norm(o.text).includes(nq));
      let html = shown.map(o => `<button type="button" class="pop-opt ${(multi ? sel.has(o.v) : sel === o.v) ? 'sel' : ''}" data-v="${esc(String(o.v))}">${o.html}<span class="ck">✓</span></button>`).join('');
      if (onCreate && q.trim() && !options.some(o => norm(o.text) === nq)) html += `<button type="button" class="pop-opt pop-create" data-create="1">+ <b>${esc(q.trim())}</b> 새로 추가</button>`;
      list.innerHTML = html || '<div class="pop-empty">결과 없음</div>';
    };
    draw();
    list.addEventListener('click', async e => {
      const b = e.target.closest('.pop-opt'); if (!b) return;
      if (b.dataset.create) { await onCreate(q.trim()); return; }
      const o = options.find(x => String(x.v) === b.dataset.v); if (!o) return;
      if (multi) { sel.has(o.v) ? sel.delete(o.v) : sel.add(o.v); draw(); onPick([...sel]); }
      else { closePop(); if (o.v !== value) onPick(o.v); }
    });
    const inp = el.querySelector('.pop-search');
    if (inp) {
      setTimeout(() => inp.focus(), 0);
      inp.addEventListener('input', () => { q = inp.value; draw(); placePop(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); list.querySelector('.pop-opt')?.click(); } });
    }
  });
}
function spPick(el) {
  const s = spOf(el.dataset.sid); if (!s || !canEdit()) return;
  const f = el.dataset.field;
  const set = v => updateSpeaker(s.id, { [f]: v });
  if (f === 'assignees') {
    const mem = projectMembers(S.pid);
    pickList(el, { multi:true, value:s.assignees || [], title:'담당자 · 여러 명 선택 가능', searchable: mem.length > 6,
      options: mem.map(p => ({ v:p.id, text:(p.full_name || '') + ' ' + p.email, html:`${avatar(p, 22)}<span>${esc(p.full_name || p.email)}</span>` })),
      onPick: set });
  } else if (f === 'nationality_id') {
    pickList(el, { value:s.nationality_id ?? null, searchable:true, title:'국적',
      options: [{ v:null, text:'', html:'<span class="tg-empty">선택 안 함</span>' }, ...S.nats.map(n => ({ v:n.id, text:n.name, html:natTag(n) }))],
      onPick: set,
      onCreate: async name => { const n = await addNationality(name); if (n) { closePop(); set(n.id); } } });
  } else {
    const list = f === 'flight_status' ? FLIGHT : f === 'hotel_status' ? HOTEL : f === 'grp' ? GROUPS : PRI;

    if (f === 'priority') opts.unshift({ v:null, text:'', html:'<span class="tg-empty">선택 안 함</span>' });
    pickList(el, { value:s[f] ?? null, options:opts, onPick:set, title: f === 'grp' ? '그룹' : f === 'priority' ? '중요도' : f === 'flight_status' ? '항공' : '숙박' });
  }
}

function linksHtml() {
  const ed = canEdit();
  if (!S.spLinksLoaded) return '<span class="tg-empty">불러오는 중…</span>';
  const items = S.spLinks.map(l => {
    const t = S.spTargets[l.target_type + ':' + l.target_id];
    const kind = l.target_type === 'task' ? '작업' : '연사';
    const inner = t
      ? `<a class="lk-open" data-act="spLinkOpen" data-type="${l.target_type}" data-id="${l.target_id}" data-pid="${t.project_id}">
          <span class="dot" style="background:${safeColor(S.projects.find(p => p.id === t.project_id)?.color)}"></span>
          <span class="lk-title">${esc(t.title || '이름 없음')}</span><span class="lk-proj">${esc(projName(t.project_id))} · ${kind}</span></a>`
      : '<span class="lk-lock">🔒 접근 권한이 없는 프로젝트의 항목</span>';
    return `<div class="link-item">${inner}${ed ? `<button type="button" class="icon-btn sm" data-act="spLinkDel" data-id="${l.id}" title="연결 해제">✕</button>` : ''}</div>`;
  }).join('');
  return items + (ed ? '<button type="button" class="add-link" data-act="spLinkAdd">+ 다른 프로젝트 항목 연결</button>' : (S.spLinks.length ? '' : EMPTY));
}
async function loadLinks() {
  const sid = S.spId; if (!sid) return;
  try {
    const links = await api.links(sid);
    const ids = { speaker: links.filter(l => l.target_type === 'speaker').map(l => l.target_id), task: links.filter(l => l.target_type === 'task').map(l => l.target_id) };
    const targets = await api.resolveTargets(ids);
    if (S.spId !== sid) return;
    S.spLinks = links; S.spLinksLoaded = true;
    S.spTargets = Object.fromEntries(targets.map(t => [t.type + ':' + t.id, t]));
  } catch (e) { console.error(e); S.spLinksLoaded = true; }
  const box = $('#spLinks'); if (box) box.innerHTML = linksHtml();
}
function linkPicker() {

/* ---------- 파일 (사진 / 항공 첨부) ---------- */
const URLC = new Map();
async function fileUrl(path) {
  const c = URLC.get(path); if (c && c.exp > Date.now()) return c.url;
  const url = await api.fileUrl(path); URLC.set(path, { url, exp: Date.now() + 50 * 60 * 1000 }); return url;
}
function hydrateFiles(root) {
  $$('img[data-fpath]', root).forEach(async img => { try { img.src = await fileUrl(img.dataset.fpath); } catch (_) { img.alt = '사진을 불러오지 못했어요'; } });
}
async function uploadPhoto(sid, file) {
  const s = spOf(sid); if (!s || !file) return;
  if (!/^image\//.test(file.type)) return toast('이미지 파일만 올릴 수 있어요', true);
  if (file.size > MAX_FILE) return toast('20MB 이하 파일만 올릴 수 있어요', true);
  const path = `${s.project_id}/${sid}/photo-${Date.now()}.${extOf(file.name) || 'jpg'}`;
  toast('사진 올리는 중…');
  try {
    await api.uploadFile(path, file, file.type);
    const old = s.photo_path;
    await updateSpeaker(sid, { photo_path: path });
    if (old) api.removeFiles([old]).catch(() => {});
    toast('사진을 올렸어요');
  } catch (e) { err(e); }
}
async function spPhotoDel() {
  const s = spOf(S.spId); if (!s?.photo_path || !confirm('사진을 삭제할까요?')) return;
  const old = s.photo_path;
  await updateSpeaker(s.id, { photo_path: null });
  api.removeFiles([old]).catch(() => {});
}
async function uploadFlightFiles(sid, files) {
  const s = spOf(sid); if (!s || !files.length) return;
  const okType = f => /^(application\/pdf|image\/png|image\/jpeg)$/.test(f.type) || /\.(pdf|png|jpe?g)$/i.test(f.name);
  const ok = files.filter(okType);
  if (ok.length < files.length) toast('PDF, PNG, JPG 파일만 올릴 수 있어요', true);
  const added = [];
  for (const [i, f] of ok.entries()) {
    if (f.size > MAX_FILE) { toast(`${f.name}: 20MB를 넘어서 올리지 못했어요`, true); continue; }
    const ext = extOf(f.name);
    const type = f.type || (ext === 'pdf' ? 'application/pdf' : ext === 'png' ? 'image/png' : 'image/jpeg');
    const path = `${s.project_id}/${sid}/flight/${Date.now()}-${i}.${ext || 'bin'}`;
    toast(`올리는 중… (${i + 1}/${ok.length})`);
    try { await api.uploadFile(path, f, type); added.push({ path, name: f.name, type, size: f.size }); } catch (e) { err(e); }
  }
  if (!added.length) return;
  const cur = spOf(sid); if (!cur) return;
  await updateSpeaker(sid, { flight_files: [...(cur.flight_files || []), ...added] });
  toast(`파일 ${added.length}개를 첨부했어요`);
}
async function spFileDel(path) {
  const s = spOf(S.spId); if (!s) return;
  const f = (s.flight_files || []).find(x => x.path === path);
  if (!confirm(`'${f?.name || '파일'}'을(를) 삭제할까요?`)) return;
  await updateSpeaker(s.id, { flight_files: (s.flight_files || []).filter(x => x.path !== path) });
  api.removeFiles([path]).catch(() => {});
}
async function spFileOpen(path) {
  const w = window.open('', '_blank');
  try { const url = await fileUrl(path); if (w) w.location.href = url; else location.href = url; }
  catch (e) { if (w) w.close(); err(e); }
}
async function spDelete() {
  const s = spOf(S.spId); if (!s) return;
  if (!confirm(`'${s.name || '이름 없음'}' 연사를 삭제할까요?\n사진·첨부파일도 함께 지워지고 되돌릴 수 없어요.`)) return;
  try {
    await api.deleteSpeaker(s.id);
    const paths = [s.photo_path, ...(s.flight_files || []).map(f => f.path)].filter(Boolean);
    if (paths.length) api.removeFiles(paths).catch(() => {});
    S.speakers = S.speakers.filter(x => x.id !== s.id);
    closeSpPage(); renderSpBody(true); toast('연사를 삭제했어요');
  } catch (e) { err(e); }
}

/* ---------- 공유 ---------- */
const projectLink = pid => `${BASE}?project=${pid}`;
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (_) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}

/* ---------- 실시간 반영 ---------- */
let metaTimer = null;
function onRealtime(kind, p) {
  if (kind === 'speakers') {
    if (p.eventType === 'DELETE') {
      const id = p.old?.id; if (!id || !spOf(id)) return;
      S.speakers = S.speakers.filter(s => s.id !== id);
      if (S.spId === id) { closeSpPage(); toast('보고 있던 연사가 다른 사람에 의해 삭제됐어요', true); }
      renderSpBody(); return;
    }
    const row = p.new; if (!row || row.project_id !== S.pid) return;
    const cur = spOf(row.id); if (cur) Object.assign(cur, row); else S.speakers.push(row);
    renderSpBody(); if (S.spId === row.id) renderSpPage();
  } else if (kind === 'nat') {
    api.nationalities().then(n => { S.nats = n; renderSpBody(); if (S.spId) renderSpPage(); }).catch(() => {});
  } else if (kind === 'links') {
    if (S.spId) loadLinks();
  } else if (kind === 'members') {
    clearTimeout(metaTimer);
    metaTimer = setTimeout(async () => {
      const before = myRole();
      try { await reloadMeta(); } catch (_) { return; }
      if (S.view === 'project' && !isMember(S.pid)) { toast('이 프로젝트에서 제외되었어요', true); return afterMembershipChange(); }
      renderSidebar(); renderPeople();
      if (myRole() !== before) { closeSpPage(); renderMain(); toast(myRole() === 'viewer' ? '권한이 뷰어로 바뀌었어요' : '권한이 편집자로 바뀌었어요'); }
    }, 400);
  }
}

/* ---------- 연사 화면 전용 이벤트 ---------- */
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset?.upload) {
    const files = [...t.files]; t.value = '';
    if (t.dataset.upload === 'photo') uploadPhoto(S.spId, files[0]); else uploadFlightFiles(S.spId, files);
    return;
  }
  const f = t.dataset?.sf; if (!f) return;
  const sid = t.closest('[data-sid]')?.dataset.sid; const s = spOf(sid); if (!s) return;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (t.type === 'date') v = v || null;
  else if (t.tagName === 'INPUT' && typeof v === 'string') v = v.trim();
  if (s[f] === v) return;
  updateSpeaker(sid, { [f]: v }, f === 'diet_flag' ? null : (t.closest('#spage') ? 'page' : 'body'));
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'spSearchIn') { sv().q = t.value; S.pinned.clear(); renderSpBody(true); }
  else if (t.classList?.contains('ta')) autosize(t);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && !e.isComposing && (t.classList?.contains('cell-in') || t.classList?.contains('pin') || t.classList?.contains('sp-title'))) { e.preventDefault(); t.blur(); }
  if (e.key === 'Escape' && t.id === 'spSearchIn') { t.value = ''; sv().q = ''; renderSpBody(true); $('#spSearchBox')?.classList.remove('open'); t.blur(); e.stopPropagation(); }
}, true);
document.addEventListener('focusout', e => {
  if (e.target.id === 'spSearchIn' && !e.target.value) setTimeout(() => { if (document.activeElement?.id !== 'spSearchIn') $('#spSearchBox')?.classList.remove('open'); }, 150);
});

// 드래그: 목록 행 / 보드 카드
let dragSid = null;
document.addEventListener('mousedown', e => { const h = e.target.closest?.('.drag-h'); if (h && canEdit()) h.closest('tr').draggable = true; });
document.addEventListener('dragstart', e => {
  const el = e.target.closest?.('.scard, tr.sp-row'); if (!el) return;
  dragSid = el.dataset.sid; e.dataTransfer.setData('text/plain', 'sp:' + dragSid); e.dataTransfer.effectAllowed = 'move';
  el.classList.add('dragging'); closePop();
});
function clearDragMarks() { $$('.over').forEach(x => x.classList.remove('over')); $$('.drop-before').forEach(x => x.classList.remove('drop-before')); }
document.addEventListener('dragend', e => {
  const el = e.target.closest?.('.scard, tr.sp-row');
  if (el) { el.classList.remove('dragging'); if (el.tagName === 'TR') el.draggable = false; }
  dragSid = null; clearDragMarks();
});
document.addEventListener('dragover', e => {
  if (!dragSid) return;
  const z = e.target.closest?.('[data-sdrop], [data-gdrop]'); if (!z) return;
  e.preventDefault();
  $$('.over').forEach(x => x !== z && x.classList.remove('over')); z.classList.add('over');
  $$('.drop-before').forEach(x => x.classList.remove('drop-before'));
  const row = e.target.closest('tr.sp-row'); if (row && row.dataset.sid !== dragSid) row.classList.add('drop-before');
});
document.addEventListener('drop', e => {
  if (!dragSid) return;
  const z = e.target.closest?.('[data-sdrop], [data-gdrop]'); if (!z) return;
  e.preventDefault();
  const sid = dragSid, s = spOf(sid); dragSid = null; clearDragMarks(); if (!s) return;
  if (z.dataset.gdrop != null) {
    const grp = Number(z.dataset.gdrop), patch = {};
    if (s.grp !== grp) patch.grp = grp;
    const row = e.target.closest('tr.sp-row');
    if (row && row.dataset.sid === sid) return;
    if (sv().sort === 'manual') {
      const rows = spSort(S.speakers.filter(x => x.grp === grp && x.id !== sid));
      const i = row ? rows.findIndex(x => x.id === row.dataset.sid) : -1;
      if (i >= 0) patch.position = i > 0 ? (rows[i - 1].position + rows[i].position) / 2 : rows[i].position - 1;
      else if (patch.grp != null || !row) patch.position = rows.length ? rows[rows.length - 1].position + 1 : s.position;
    }
    if (Object.keys(patch).length) updateSpeaker(sid, patch);
  } else {
    const f = z.dataset.sfield; let val = z.dataset.sdrop; if (f === 'grp') val = Number(val);
    if (s[f] !== val) updateSpeaker(sid, { [f]: val });
  }
});

/* =====================================================================
   이벤트
   ===================================================================== */
const ACT = {
  my: () => { leaveProject(); S.view = 'mytasks'; S.pid = null; renderSidebar(); renderMain(); },
  share: () => shareModal(),
  shRemove: async el => { await removeFromProject(S.pid, el.dataset.uid); if (curProject() && isMember(S.pid)) shareModal(); },
  spTab: el => { closePop(); S.stab = el.dataset.tab; renderMain(); },
  spAdd: el => spAdd(el),
  spOpen: el => openSpPage(el.dataset.sid),
  spClose: () => closeSpPage(),
  spDone: el => { const s = spOf(el.dataset.sid); if (s && canEdit()) updateSpeaker(s.id, { done: !s.done }); },
  spPick: el => spPick(el),
  spFold: el => { const v = sv(), k = Number(el.dataset.grp); v.fold = v.fold.includes(k) ? v.fold.filter(x => x !== k) : [...v.fold, k]; renderSpBody(true); },
  spFilter: el => spFilter(el),
  spSort: el => spSortPick(el),
  spSearch: () => spSearchToggle(),
  spFilterReset: () => { resetFilters(true); renderMain(); },
  spFlip: el => { const s = spOf(S.spId); if (s) updateSpeaker(s.id, { [el.dataset.f]: !s[el.dataset.f] }); },
  spSet: el => { const s = spOf(S.spId); const v = el.dataset.v === '1'; if (s && s[el.dataset.f] !== v) updateSpeaker(s.id, { [el.dataset.f]: v }); },
  spPhotoDel: () => spPhotoDel(),
  spFileOpen: el => spFileOpen(el.dataset.path),
  spFileDel: el => spFileDel(el.dataset.path),
  spDelete: () => spDelete(),
  spLinkAdd: () => linkPicker(),
  spLinkDel: async el => { if (!confirm('이 연결을 해제할까요?')) return; try { await api.removeLink(el.dataset.id); loadLinks(); } catch (e) { err(e); } },
  spLinkOpen: el => spLinkOpen(el.dataset),
  project: el => openProject(el.dataset.pid),
  tab: el => { S.tab = el.dataset.tab; renderMain(); },
  addProject: projectModal,
  invite: inviteModal,
  access: el => accessModal(el.dataset.uid),
  removeChip: el => removeFromProject(el.dataset.pid, el.dataset.uid),
  openTask: el => openTask(el.dataset.id),
  closeDrawer,
  toggleDone: el => toggleDone(el.dataset.id),
  deleteTask: el => deleteTask(el.dataset.id),
  newDoc,
  openDoc: el => { flushDoc(); S.docId = el.dataset.id; renderMain(); },
  deleteDoc,
  closeModal: () => closeModal(),
  changePw: () => passwordModal(false),
  selectAll: () => { const all = $$('#modalRoot .sw'); const on = all.some(i => !i.checked); all.forEach(i => i.checked = on); },
  logout: () => { if (confirm('로그아웃할까요?')) api.signOut(); },
  editName: nameModal,
  togglePeople,
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.stopPropagation();
  ACT[el.dataset.act]?.(el, e);
});

document.addEventListener('submit', async e => {
  if (e.target.id === 'loginForm') return handleLogin(e);
  const f = e.target.closest('.quick-add'); if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'); const title = inp.value.trim(); if (!title) return;
  const status = f.dataset.status;
  inp.disabled = true;
  try {
    await createTask(status, title);
    renderMain();
    document.querySelector(`.quick-add[data-status="${status}"] input`)?.focus();
  } catch (er) { err(er); inp.disabled = false; }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'docTitle' || t.id === 'docBody') scheduleDocSave();
  else if (t.id === 'peopleSearch') { S.search = t.value; renderPeopleList(); }
  else if (t.classList?.contains('t-title')) autosize(t);
});

document.addEventListener('change', e => {
  const f = e.target.dataset?.field;
  if (!f || !e.target.closest('#drawer')) return;
  updateTaskField($('#drawer').dataset.id, f, e.target.value);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (POP.el) closePop();
    else if ($('#modalRoot').classList.contains('open')) closeModal();
    else if ($('#spage').classList.contains('open')) closeSpPage();
    else if ($('#drawer').classList.contains('open')) closeDrawer();
  }
  if (e.key === 'Enter' && e.target.classList?.contains('t-title')) { e.preventDefault(); e.target.blur(); }
});

// 문서 툴바 (선택 영역 유지를 위해 mousedown 사용)
document.addEventListener('mousedown', e => {
  const b = e.target.closest('[data-cmd]'); if (!b) return;
  e.preventDefault();
  const c = b.dataset.cmd;
  if (['h1','h2','h3','p','blockquote'].includes(c)) document.execCommand('formatBlock', false, c);
  else document.execCommand(c, false, null);
  scheduleDocSave();
});

// 보드 드래그 앤 드롭
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move';
  c.classList.add('dragging');
});
document.addEventListener('dragend', e => {
  e.target.closest?.('.card')?.classList.remove('dragging');
  $$('.col.over').forEach(x => x.classList.remove('over'));
});
document.addEventListener('dragover', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); $$('.col.over').forEach(x => x !== z && x.classList.remove('over')); z.classList.add('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const id = e.dataTransfer.getData('text/plain');
  if (id) updateTaskField(id, 'status', z.dataset.drop);
});

window.addEventListener('beforeunload', flushDoc);
start();
</script>
</body>
